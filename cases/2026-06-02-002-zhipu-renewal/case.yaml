name: 2026-06-02-002-zhipu-renewal
class: reasoning
# 判官驱动的开放型数学/分析推理用例（与 fizzbuzz 的 check 驱动编码用例互补）。
# 纯 prompt，无文件产出——模型回答写入 artifacts/OUTPUT.txt 供裁判评分。

task:
  type: prompt
  prompt_file: prompts/task.md

check:
  type: none           # 开放型分析，无确定性脚本校验，靠 LLM 裁判

judge:
  enabled: true
  rubric_file: prompts/rubric.md
  dimensions: [基础核验, 折扣分析, 差异解释, 策略洞察]

# requires_engine 省略 → 所有引擎都能做数学推理
