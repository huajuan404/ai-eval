<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d">
  <title id="t">Flamingo riding a bicycle</title>
  <desc id="d">A pink flamingo pedals a teal bicycle. Wheels spin, cranks turn, and its legs piston in sync with the pedals.</desc>

  <!-- sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E6"/><stop offset="1" stop-color="#FDE7F2"/>
    </linearGradient>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="136" x2="0" y2="266">
      <stop offset="0" stop-color="#FCAAC9"/><stop offset="1" stop-color="#F25D96"/>
    </linearGradient>
    <radialGradient id="sunG">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#FDBA74"/>
    </radialGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="46" ry="20"/><ellipse cx="-32" cy="8" rx="30" ry="15"/><ellipse cx="34" cy="8" rx="32" ry="16"/>
    </g>
  </defs>
  <rect width="900" height="600" fill="url(#sky)"/>
  <circle cx="762" cy="112" r="58" fill="#FCD34D" opacity="0.25"/>
  <circle cx="762" cy="112" r="44" fill="url(#sunG)">
    <animate attributeName="r" values="44;47;44" keyTimes="0;.5;1" dur="7s" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1" repeatCount="indefinite"/>
  </circle>

  <!-- clouds (tile width 900 -> seamless scroll) -->
  <g fill="#FFFFFF" opacity="0.9">
