      <use href="#cloud" x="150" y="100"/><use href="#cloud" x="1050" y="100"/>
      <use href="#cloud" x="480" y="60"/><use href="#cloud" x="1380" y="60"/>
    </g>
    <g opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="0 0;-900 0" dur="44s" repeatCount="indefinite"/>
      <use href="#cloud" x="320" y="190"/><use href="#cloud" x="1220" y="190"/>
    </g>
  </g>

