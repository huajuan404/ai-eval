<title id="title">The morning commute</title>
<desc id="desc">A white pelican with a long golden bill rides a teal bicycle, its webbed feet on the pedals and a wing reaching to the handlebars. A rust-red scarf flutters in the breeze beneath a warm sun.</desc>
