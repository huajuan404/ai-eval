  <path d="M242,296 C240,268 270,246 310,244 C350,242 400,252 436,266 C470,279 480,306 468,322 C458,332 440,336 410,337 C360,338 320,334 292,326 C272,320 252,310 242,296 Z" fill="#FDFBF7"/>

  <!-- 尾羽 -->
  <path d="M252,300 L222,282 Q216,288 230,302 Z" fill="#FDFBF7"/>
  <path d="M246,312 L214,304 Q212,312 228,318 Z" fill="#F0EBE0"/>
  <path d="M258,286 L232,270 Q226,275 240,288 Z" fill="#F0EBE0"/>

