  <!-- 喉囊（半透明，隐约透出小鱼） -->
  <path d="M536,215 C560,218 588,220 612,223 C634,227 648,240 646,255 C644,270 616,282 584,278 C552,274 526,262 504,248 C496,242 500,226 512,220 C520,216 528,215 536,215 Z" fill="#F2652B" fill-opacity="0.92"/>
  <path d="M542,232 Q576,248 604,252" stroke="#D94F1F" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- 近侧腿与脚蹼 -->
  <path d="M350,335 C358,365 366,395 388,425" stroke="#F0962E" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M388,425 L448,496" stroke="#F0962E" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M448,496 L474,492 Q479,500 471,504 L452,505 Z" fill="#F0962E"/>
</svg>
