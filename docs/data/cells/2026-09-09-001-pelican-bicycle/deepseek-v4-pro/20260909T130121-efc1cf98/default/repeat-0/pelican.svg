    <ellipse cx="586" cy="252" rx="17" ry="7.5" fill="#5FA3DC"/>
    <path d="M601,252 L614,243 L614,261 Z" fill="#5FA3DC"/>
    <circle cx="578" cy="250" r="1.8" fill="#22303A"/>
