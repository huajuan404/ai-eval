    <path d="M482,553 C481,546 485,543 491,544"/>
    <path d="M700,548 C699,540 702,536 708,535"/>
    <path d="M702,549 C701,542 705,539 711,540"/>
  </g>
  <g>
    <circle cx="124" cy="548" r="3" fill="#F0A8BC"/>
    <circle cx="132" cy="548" r="3" fill="#F0A8BC"/>
    <circle cx="128" cy="544" r="3" fill="#F0A8BC"/>
    <circle cx="128" cy="552" r="3" fill="#F0A8BC"/>
    <circle cx="128" cy="548" r="2.2" fill="#F6C445"/>
    <circle cx="628" cy="546" r="3" fill="#FFFFFF"/>
    <circle cx="636" cy="546" r="3" fill="#FFFFFF"/>
