  <circle cx="512" cy="202" r="26" fill="#FDFBF7"/>
  <path d="M492,182 Q478,168 470,170 Q480,174 488,186 Z" fill="#FDFBF7"/>
  <circle cx="518" cy="189" r="5" fill="#26282A"/>
  <circle cx="520" cy="187" r="1.7" fill="#FFFFFF"/>

