<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="t d">
<title id="t">Capybara calmly riding a bicycle</title>
<desc id="d">A capybara with a calm expression pedals a bicycle. The wheels spin, the pedals turn, and its short legs follow the pedals in perfect sync.</desc>
