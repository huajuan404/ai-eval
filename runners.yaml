# Runner 档案注册表（独立于 ~/tools/config.env，runner 与 judge 共用）。
#
# 每个档案 = 标签 → 启动方式。四类 launcher：
#   claude   : claude -p --output-format json
#   codex    : codex exec --json（默认 sandbox=workspace-write，否则写不了文件）
#   c        : 复用 PATH 上的 c <config>（config 指向 config.env 的 CONFIG_<n>）
#   command  : 通用命令模板（sf cli / 自定义斜杠命令 / 任意外部 agent）
#
# 安全：禁止明文密钥。凭证用 ${ENV_VAR} 插值，benchmark 不持有 token。

runners:
  # ── 默认 runner / judge ──────────────────────────────
  codex:
    launcher: codex
    sandbox: workspace-write   # 必须，否则 agent 处于只读沙箱无法写文件
  claude:
    launcher: claude   # 当前默认是opus 4.8
  sonnet-4.6:
    launcher: claude          # 启动器类型，只能是 claude/codex/c/command
    model: claude-sonnet-4-6  # 模型走独立的 model 字段（适配器会拼成 --model）
  sonnet-4.6-bare:
    launcher: claude
    model: claude-sonnet-4-6
    args: ["--setting-sources", "project"]  # 隔离全局 ~/.claude/CLAUDE.md，只读 workdir 项目级指令；用于痛点用例 bare/clause 档校准
  opus-4.6:
    launcher: claude
    model: claude-opus-4-6
  claude-fable-5:
    launcher: claude
    model: claude-fable-5     # 最新模型；走 claude 启动器直连（如实际 model id 不同请改此值）

  # ── 经 c 切换器的模型（config 指向 config.env 索引）──
  minimax-m3:
    launcher: c
    config: 0
  # 同一 lane 的直调路径：用于需要隔离 Agent harness 的结构化 prompt 评测。
  # 运行时脚本由对应 case protocol 放入 workdir；本机缺少 CONFIG_0 时明确失败。
  minimax-m3-c0-direct:
    launcher: command
    template: "python3 {cwd}/run_provider.py --prompt-file {prompt_file} --workdir {cwd} --lane 0"
    model: MiniMax-M3
    metrics: none
  minimax-m2.7:
    launcher: c
    config: 5
  deepseek-v4:
    launcher: c
    config: 1
  deepseek-v4-flash:
    launcher: c
    config: 9   # 与 deepseek-v4(pro/config 1) 同 endpoint+token，仅 MODEL 不同（flash）
  glm-5.1:
    launcher: c
    config: 6   # 本机 CONFIG_6 = open.bigmodel.cn/anthropic, MODEL=glm-5.1
  glm-5.2:
    launcher: c
    config: 2
  kimi-k3:
    launcher: c
    config: 3   # 本机 CONFIG_3 = api.kimi.com/coding, MODEL=k3[1m]
  agnes-2.0-flash:
    launcher: c
    config: 4   # config.env 的 CONFIG_4：apihub.agnes-ai.com/v1，PROTOCOL=openai（本机 c 脚本做 openai→claude 转换）

  # ── 通用命令模板示例（sf cli / 自定义编排）──────────
  # 占位符：{prompt} {prompt_file} {cwd} {model} {skill}
  # metrics: none → 仅采集墙钟，token/成本降级为「不可用」
  # sf-skill:
  #   launcher: command
  #   template: "sf run --skill {skill} --cwd {cwd} --prompt-file {prompt_file}"
  #   metrics: none

  # ── 弱模型基线（floor，故意很笨的小模型当反例）──────────────
  # 本地 ollama qwen2.5:0.5b，经 litellm Anthropic 代理（127.0.0.1:4141）由 config.env 的 CONFIG_8 接入，
  # 走 c 切换器（c 8）。用途：跑多实例 case 时做「地板」——真模型要明显跑赢它（跑赢 base rate）才算有区分度。
  # 不用 hardcode 固定答案（自己挑真值=作弊）；用真小模型，让它自己去蒙。
  # 依赖本机两个常驻服务（ollama + 一个 Anthropic↔ollama 翻译代理）；属本机环境，跨机不可移植。
  qwen-0.5b-weak:
    launcher: c
    config: 8
    env:
      MAX_THINKING_TOKENS: "0"   # 小模型不支持 extended thinking，关掉，否则 litellm→ollama 报错
