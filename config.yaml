# 一次运行配置。CLI 参数覆盖此文件（-r/-c/-j/--repeat）。

# 参与对比的 runner 档案标签（见 runners.yaml）。留空 = 全部档案。
runners: []

# 要跑的用例名（见 cases/）。留空 = 全部用例。
cases: []

# 裁判档案标签（默认 claude）。
judge: claude

# 每格运行次数。>1 时计分卡报告中位数 + 离散度（支撑「可靠」结论）。
repeat: 1

# 采集维度开关。
dimensions:
  quality: true
  latency: true
  cost: true
  agentic: true
