# 模型档案与价格表：runner 标签（runners.yaml）→ 展示名、厂商、模型 id、发布日期、按生效日期版本化的价格。
#
# 价格只追加不修改：厂商调价就新增一条 `since` 更晚的条目。公开账本里的每条记录在发布时按运行日期
# 取当时生效的价格算出 cost_usd 并冻结，不随后来的调价重算。
# 单位：每百万 token。厂商未列缓存价时按 input 价计。非美元报价按下方 fx 换算。
# 来源必须是厂商官方价格页；没有核实到的模型不写 pricing，成本显示为 —。

runners:
  claude:
    display: Claude (CLI 默认)
    vendor: Anthropic
    model: claude CLI 默认模型
  claude-fable-5.1:
